<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory editor</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<main>
<header>
<div><h1>Inventory editor</h1></div>
<div class="toolbar">
<span id="status" role="status" aria-live="polite">Disconnected</span>
<button id="connect">Connect</button>
<button id="disconnect" disabled>Disconnect</button>
</div>
</header>
<p id="message" role="alert"></p>
<div class="loading-feedback" aria-label="Loading status">
<span id="catalog-status" role="status" aria-live="polite">Loading catalogue...</span>
<button id="catalog-retry" hidden>Retry catalogue loading</button>
<span id="icon-status" role="status">Loading icons...</span>
<button id="icon-retry" hidden>Retry icon loading</button>
</div>
<div class="tabs" role="tablist" aria-label="Workspace">
<button id="inventory-tab" role="tab" aria-selected="true" aria-controls="inventory-panel">Inventory <span id="count">(0 items)</span></button>
<button id="catalog-tab" role="tab" aria-selected="false" aria-controls="catalog-panel" tabindex="-1">Catalogue</button>
<button id="presets-tab" role="tab" aria-selected="false" aria-controls="presets-panel" tabindex="-1">⚡ Presets (Сеты)</button>
</div>
<div class="workspace">
<section id="inventory-panel" role="tabpanel" aria-labelledby="inventory-tab">
<div class="filters">
<label>Search inventory<input id="inventory-search" type="search" placeholder="Search items&hellip;"></label>
<label>Category<select id="inventory-category"><option value="">All categories</option></select></label>
</div>
<p id="inventory-count" role="status" aria-live="polite"></p>
<p id="empty">Connect to receive inventory.</p>
<div id="items" class="grid-viewport" role="list" aria-label="Inventory items"></div>
</section>
<section id="catalog-panel" role="tabpanel" aria-labelledby="catalog-tab" hidden>
<fieldset id="catalog-controls" disabled>
<legend class="sr-only">Browse templates</legend>
<div class="filters">
<label>Search catalogue<input id="catalog-search" type="search" placeholder="Search items&hellip;"></label>
<label>Category<select id="catalog-category"><option value="">All categories</option></select></label>
<label>Color<select id="catalog-color">
<option value="">All colors</option>
<option value="red">🔴 Red (Красный)</option>
<option value="blue">🔵 Blue (Синий)</option>
<option value="green">🟢 Green (Зеленый)</option>
<option value="yellow">🟡 Yellow/Gold (Золотой)</option>
<option value="purple">🟣 Purple (Фиолетовый)</option>
<option value="pink">🌸 Pink (Розовый)</option>
<option value="orange">🟠 Orange (Оранжевый)</option>
<option value="white">⚪ White (Белый)</option>
<option value="black">⚫ Black (Черный)</option>
</select></label>
<label>View<select id="catalog-view"><option value="variants">Variants</option><option value="definitions">Definitions</option></select></label>
</div>
<div id="catalog-color-pills" class="color-pills" aria-label="Color quick filter">
<button type="button" class="color-pill active" data-color="">Все цвета</button>
<button type="button" class="color-pill" data-color="red" style="--dot-color:#e63946"><span class="color-dot" style="background-color:#e63946"></span>Красный</button>
<button type="button" class="color-pill" data-color="blue" style="--dot-color:#3a86ff"><span class="color-dot" style="background-color:#3a86ff"></span>Синий</button>
<button type="button" class="color-pill" data-color="green" style="--dot-color:#2a9d8f"><span class="color-dot" style="background-color:#2a9d8f"></span>Зеленый</button>
<button type="button" class="color-pill" data-color="yellow" style="--dot-color:#ffb703"><span class="color-dot" style="background-color:#ffb703"></span>Золотой</button>
<button type="button" class="color-pill" data-color="purple" style="--dot-color:#9d4edd"><span class="color-dot" style="background-color:#9d4edd"></span>Фиолетовый</button>
<button type="button" class="color-pill" data-color="pink" style="--dot-color:#f72585"><span class="color-dot" style="background-color:#f72585"></span>Розовый</button>
<button type="button" class="color-pill" data-color="orange" style="--dot-color:#fb8500"><span class="color-dot" style="background-color:#fb8500"></span>Оранжевый</button>
<button type="button" class="color-pill" data-color="white" style="--dot-color:#f8f9fa"><span class="color-dot" style="background-color:#f8f9fa"></span>Белый</button>
<button type="button" class="color-pill" data-color="black" style="--dot-color:#444444"><span class="color-dot" style="background-color:#222222; border: 1px solid #555;"></span>Черный</button>
</div>
<div id="advanced-label" hidden>
<label><input id="catalog-all" type="checkbox"> Show hidden and special items</label>
</div>
<p id="catalog-count" role="status" aria-live="polite"></p>
<div id="catalog-results" class="grid-viewport" role="list" aria-label="Catalogue items"></div>
</fieldset>
</section>
<section id="presets-panel" role="tabpanel" aria-labelledby="presets-tab" hidden>
<div class="presets-header">
<div class="presets-filters">
<div class="side-selector" role="group" aria-label="Filter by side">
<button type="button" class="side-btn active" data-side="all">Все сеты</button>
<button type="button" class="side-btn" data-side="T">🔴 T-Side</button>
<button type="button" class="side-btn" data-side="CT">🔵 CT-Side</button>
</div>
<label class="presets-color-label">Цвет сета
<select id="presets-color-filter">
<option value="">Все цвета</option>
<option value="red">🔴 Красные</option>
<option value="blue">🔵 Синие</option>
<option value="yellow">🟡 Золотые</option>
<option value="white">⚪ Белые</option>
<option value="purple">🟣 Фиолетовые</option>
<option value="green">🟢 Зеленые</option>
<option value="black">⚫ Черные</option>
</select>
</label>
</div>
<div id="preset-progress-container" class="preset-progress-container" hidden>
<span id="preset-progress-text">Добавление сета...</span>
<div class="progress-track"><div id="preset-progress-bar" class="progress-fill"></div></div>
</div>
</div>
<div id="presets-grid" class="presets-grid"></div>
</section>
<aside id="inspector" aria-label="Item inspector">
<button id="inspector-close" hidden aria-label="Close item inspector">Close</button>
<p id="inspector-empty">Select an item to see its details.</p>
<section id="selection" hidden aria-labelledby="selection-name">
<img id="selection-icon" class="selection-thumbnail" width="280" height="210" alt="" decoding="async">
<h2 id="selection-name"></h2>
<p id="selection-badges"></p>
<dl id="selection-info"></dl>
<fieldset id="creation-controls" hidden>
<legend class="sr-only">Creation parameters</legend>
<div id="paint-controls" hidden>
<label for="wear">Wear</label>
<input id="wear" type="text" inputmode="decimal" min="0" max="1" autocomplete="off" spellcheck="false">
<input id="wear-slider" type="range" step="0.0001" min="0" max="1" aria-label="Wear slider">
<label>Paint seed<input id="seed" type="number" min="0" max="1000" step="1" value="0"></label>
</div>
<label id="stattrak-label" hidden><input id="stattrak" type="checkbox"> StatTrak</label>
<label id="counter-label" hidden>Starting counter<input id="counter" type="number" min="0" max="4294967295" step="1" value="0"></label>
</fieldset>
<p id="selection-reason"></p>
<button id="create" disabled>Add to inventory</button>
<button id="delete" hidden disabled>Delete item</button>
</section>
</aside>
</div>
<div class="creation-feedback">
<p id="creation-status" role="status" aria-live="polite"></p>
<p id="deletion-status" role="status" aria-live="polite"></p>
<button id="view-created" hidden>View in inventory</button>
</div>
</main>
<script type="module" src="app.js?v=2"></script>
</body>
</html>
